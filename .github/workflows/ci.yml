name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libcsfml-dev xvfb

      - name: Build with warnings as errors
        run: make CFLAGS="-Wall -Wextra -Werror -Iinclude -MMD -MP -ffp-contract=off -O2"

      # The simulation only: no window, no audio. Runs under ASan and UBSan.
      - name: Unit and determinism tests
        run: make test

      # Exit 1 only on a file that cannot be read or has invalid lines (7.4);
      # every other finding is printed and does not fail the build.
      - name: Every level loads without invalid lines
        run: |
          for f in levels/*.gd; do
            ./my_gd --check "$f" || exit 1
          done

      # Random bytes as level files, under ASan/UBSan (8.1). New inputs go to
      # the first folder; levels/ only seeds it and is never written.
      - name: Fuzz the parser for 60 s
        run: |
          sudo apt-get install -y clang
          make fuzz_parser
          mkdir -p build/fuzz_corpus
          ./fuzz_parser -max_total_time=60 build/fuzz_corpus levels

      # It must still be running after 5 s: a crash or an early exit fails.
      # The step's shell runs with -e, so the expected 124 is caught, not fatal.
      - name: The game starts and keeps running
        run: |
          code=0
          ALSOFT_DRIVERS=null xvfb-run -a timeout 5 ./my_gd || code=$?
          test "$code" -eq 124
